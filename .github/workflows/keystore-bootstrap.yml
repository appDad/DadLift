# ONE-TIME: mint the Android signing keystore for the TWA APK. The result is
# encrypted to an RSA public key passed as input, so nothing secret lands in a
# public artifact. Delete this workflow once the keystore is in repo secrets.
name: Keystore bootstrap (one-time)
on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: RSA public key (PEM) to encrypt the result for
        required: true
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Generate keystore + encrypt for the requester
        env:
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          set -e
          PASS=$(openssl rand -base64 30 | tr -d '/+=' | cut -c1-32)
          echo "::add-mask::$PASS"
          keytool -genkeypair -v -keystore dadlift.keystore -alias dadlift -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=DadLift, O=appDad, C=US" >/dev/null 2>&1
          keytool -list -v -keystore dadlift.keystore -alias dadlift -storepass "$PASS" | grep -i 'SHA256:' | head -1 | sed 's/.*SHA256: *//' > fingerprint.txt
          printf '%s' "$PASS" > password.txt
          printf '%s' "$PUBKEY" > pub.pem
          node -e '
            const c=require("crypto"),fs=require("fs");
            const payload=JSON.stringify({keystore:fs.readFileSync("dadlift.keystore").toString("base64"),password:fs.readFileSync("password.txt","utf8"),fingerprint:fs.readFileSync("fingerprint.txt","utf8").trim()});
            const key=c.randomBytes(32),iv=c.randomBytes(12);
            const ci=c.createCipheriv("aes-256-gcm",key,iv);const enc=Buffer.concat([ci.update(payload,"utf8"),ci.final()]);const tag=ci.getAuthTag();
            const ek=c.publicEncrypt({key:fs.readFileSync("pub.pem","utf8"),padding:c.constants.RSA_PKCS1_OAEP_PADDING,oaepHash:"sha256"},key);
            fs.writeFileSync("bundle.json",JSON.stringify({ek:ek.toString("base64"),iv:iv.toString("base64"),tag:tag.toString("base64"),data:enc.toString("base64")}));
          '
          rm -f dadlift.keystore password.txt pub.pem
          echo "SHA-256 fingerprint: $(cat fingerprint.txt)"
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-bundle
          path: bundle.json
          retention-days: 1
