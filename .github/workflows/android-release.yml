# Cut an Android APK release. The APK is a Trusted Web Activity: a thin shell
# that opens https://dadlift.web.app full-screen. It contains NO app code, so
# it never needs re-releasing for app changes - updates flow through the
# website. Re-run only if the icon, name, or package changes.
name: Android APK release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version name (e.g. 1.0.3). Defaults to 1.0.<run number>
        required: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g @bubblewrap/cli
      - name: Point Bubblewrap at the runner's JDK + SDK (avoids interactive prompts)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json
      - name: Restore signing keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > dadlift.keystore
      - name: Resolve version
        id: v
        run: |
          NAME="${{ inputs.version }}"; [ -z "$NAME" ] && NAME="1.0.${{ github.run_number }}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "version $NAME (code ${{ github.run_number }})"
      - name: Generate Android project from twa-manifest.json
        run: bubblewrap update --skipVersionUpgrade --appVersionName "${{ steps.v.outputs.name }}" --appVersionCode "${{ steps.v.outputs.code }}"
      - name: Build signed APK + AAB
        run: bubblewrap build --skipPwaValidation
      - name: Publish GitHub Release with the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.v.outputs.name }}"
          cp app-release-signed.apk "DadLift-$TAG.apk"
          gh release create "$TAG" "DadLift-$TAG.apk" app-release-bundle.aab \
            --title "DadLift $TAG (Android)" \
            --notes "Android app shell (Trusted Web Activity) that opens https://dadlift.web.app full-screen. Install the APK, then all updates arrive through the website automatically - this file only needs replacing if the icon, name, or package changes. Needs Chrome on the device."
          rm -f dadlift.keystore
